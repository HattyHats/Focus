<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus — Personalized Writing & Research Command Center</title>
    <meta name="description" content="A next-generation cyberpunk productivity command center designed to eliminate noise and maximize deep work. Created by HattyHats.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <meta name="theme-color" content="#06070a">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css?v=4.2">
</head>
<body>
    <div class="cyber-grid"></div>

    <!-- ======================================================================
         UPGRADED CINEMATIC SPLASH SCREEN
         ====================================================================== -->
    <div id="splashScreen">
        <canvas id="splashCanvas"></canvas>
        <div class="splash-vignette"></div>

        <div class="splash-center">
            <!-- Hologram Ring & Core Icon -->
            <div class="splash-logo-container">
                <div class="splash-ring"></div>
                <div class="splash-ring-inner"></div>
                <div class="splash-core-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="6"></circle>
                        <circle cx="12" cy="12" r="2"></circle>
                    </svg>
                </div>
            </div>

            <!-- Title & HattyHats Attribution -->
            <h1 class="splash-title">FOCUS</h1>
            <p class="splash-subtitle">Your Personalized Command Center • Created by HattyHats</p>

            <!-- Dynamic Inspirational Focus Quote -->
            <div class="splash-quote-box" id="splashQuote">
                “Deep work is the superpower of the 21st century.”
            </div>

            <!-- Cyber Telemetry Status -->
            <div class="splash-telemetry">
                <span class="telemetry-dot"></span>
                <span id="telemetryText">INITIALIZING NEURAL MATRIX...</span>
            </div>

            <!-- Interactive Enter Button -->
            <button id="enterBtn" class="splash-enter-btn">
                <span>Enter Command Center</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>

            <!-- Options -->
            <div class="splash-options">
                <label>
                    <input type="checkbox" id="dontShowSplash"> Don't show intro on next visit
                </label>
            </div>
        </div>
    </div>

    <!-- ======================================================================
         MAIN DASHBOARD APPLICATION
         ====================================================================== -->
    <div id="mainApp">
        <!-- Sticky Navigation Header -->
        <header class="app-header">
            <!-- Left: Brand Identity -->
            <div class="header-left">
                <div class="brand-badge">
                    <div class="brand-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <circle cx="12" cy="12" r="4"></circle>
                            <line x1="12" y1="2" x2="12" y2="6"></line>
                            <line x1="12" y1="18" x2="12" y2="22"></line>
                            <line x1="2" y1="12" x2="6" y2="12"></line>
                            <line x1="18" y1="12" x2="22" y2="12"></line>
                        </svg>
                    </div>
                    <div class="brand-text">
                        <h1>Focus</h1>
                        <p>Created by HattyHats</p>
                    </div>
                </div>
            </div>

            <!-- Center: Zen Soundscape & Daily Focus Stats -->
            <div class="header-center">
                <div class="zen-sound-pill">
                    <button class="zen-sound-btn" id="zenSoundBtn" title="Play / Pause Ambient Focus Audio">
                        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>
                    <select class="sound-select" id="soundSelect">
                        <option value="rain">Cyber Rain</option>
                        <option value="drone">Deep Space (Alpha)</option>
                        <option value="white">White Noise</option>
                    </select>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" title="Volume">
                </div>

                <div class="focus-stats-pill">
                    <div class="stat-chip">
                        <span>🎯</span>
                        <span>Sessions:</span>
                        <strong id="todayFocusSessions">0</strong>
                    </div>
                    <div class="stat-chip">
                        <span>🔥</span>
                        <span>Streak:</span>
                        <strong>4d</strong>
                    </div>
                </div>
            </div>

            <!-- Right: Action Controls & Modals -->
            <div class="header-right">
                <!-- Zen Mode Button -->
                <button class="btn-icon" id="zenModeBtn" title="Toggle Zen Distraction-Free Mode">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                </button>

                <!-- Theme Customizer Dropdown -->
                <div style="position: relative;">
                    <button class="btn-icon" id="themeToggleBtn" title="Customize Theme Color">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="m4.93 4.93 4.24 4.24"></path>
                            <path d="m14.83 9.17 4.24-4.24"></path>
                            <path d="m14.83 14.83 4.24 4.24"></path>
                            <path d="m9.17 14.83-4.24 4.24"></path>
                            <circle cx="12" cy="12" r="4"></circle>
                        </svg>
                    </button>
                    <div class="dropdown-menu" id="themeDropdown">
                        <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); padding:4px 8px;">THEME PALETTES</div>
                        <div class="theme-palette-grid"></div>
                    </div>
                </div>

                <!-- Quick Links Dropdown -->
                <div style="position: relative;">
                    <button class="btn-pill" id="linksToggleBtn" title="Quick Links">
                        <span>Links</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                    <div class="dropdown-menu" id="linksDropdown" style="width: 230px;">
                        <a href="https://earnwithhatty.com/" target="_blank" rel="noopener noreferrer" class="dropdown-item">
                            <span>🎩</span> Earn With Hatty
                        </a>
                        <a href="https://hatsquickpad.netlify.app/" target="_blank" rel="noopener noreferrer" class="dropdown-item">
                            <span>⚡</span> Quick-Pad
                        </a>
                        <a href="https://hattyhats.github.io/local-cast/" target="_blank" rel="noopener noreferrer" class="dropdown-item">
                            <span>📡</span> Local-Cast
                        </a>
                        <a href="https://hattyhats.github.io/chill-with-hatty/" target="_blank" rel="noopener noreferrer" class="dropdown-item">
                            <span>🎧</span> Chill With Hatty
                        </a>
                    </div>
                </div>

                <!-- Add Widget Button -->
                <button class="btn-pill btn-add-widget" id="openAddWidgetBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Add Gadget</span>
                </button>
            </div>
        </header>

        <!-- Workspace Tabs Bar -->
        <div class="workspace-bar-container">
            <div class="workspace-tabs" id="workspaceTabs">
                <!-- Dynamically populated workspace tabs -->
            </div>
            <button class="btn-new-tab" id="newTabBtn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>New Workspace</span>
            </button>
        </div>

        <!-- Widget Grid -->
        <main class="widget-grid" id="widgetGrid">
            <!-- Dynamically populated widgets -->
        </main>
    </div>

    <!-- ======================================================================
         ADD WIDGET DIRECTORY MODAL
         ====================================================================== -->
    <div class="modal-backdrop" id="addWidgetModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <div class="modal-title">Gadget Directory</div>
                <button class="widget-btn" id="closeAddWidgetBtn" style="width:32px; height:32px; font-size:1.1rem;">✕</button>
            </div>
            <div class="modal-search">
                <input type="text" class="modal-search-input" id="widgetSearchInput" placeholder="Search 24 productivity gadgets...">
            </div>
            <div class="modal-body" id="widgetDirectoryGrid">
                <!-- Dynamically populated gadget cards -->
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script src="app.js?v=4.2"></script>
</body>
</html>
